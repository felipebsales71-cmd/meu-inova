<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Inova - Redefinir senha</title><link rel="stylesheet" href="styles.css"></head><body><div class="login-shell"><section class="login-hero"><div class="login-brand"><img src="assets/logo.png" alt="Inova"><h1>Redefinição de senha</h1><p>A nova senha é definida pelo titular da conta por meio de link temporário.</p></div></section><section class="login-panel"><form class="login-card" id="resetForm"><img class="logo-mini" src="assets/logo.png" alt="Inova"><h2>Definir nova senha</h2><p class="intro">O link expira automaticamente.</p><div class="field"><label>Nova senha</label><input id="newPassword" type="password" minlength="6" required></div><div class="field"><label>Confirmar nova senha</label><input id="confirmPassword" type="password" minlength="6" required></div><button class="primary-btn full" type="submit">Salvar nova senha</button><div id="result" class="login-demo">A senha não é exibida nem definida pelo administrador.</div></form></section></div><script>const token=new URLSearchParams(location.search).get('token');const form=document.getElementById('resetForm'),result=document.getElementById('result');form.onsubmit=async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){result.textContent='As senhas não conferem.';return}if(!token){result.textContent='Link inválido: token ausente.';return}try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:a})});const j=await r.json();if(!r.ok)throw new Error(j.detail||'Falha ao redefinir.');result.textContent=j.message+' Você já pode voltar ao portal e entrar com a nova senha.';form.querySelector('button').disabled=true}catch(err){result.textContent=err.message}}</script></body></html>
